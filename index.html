<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>구구단 거꾸로 풀기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <style>
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-bounce { animation: bounce 1s infinite; }
    .animate-pulse { animation: pulse 1.5s infinite; }
    .animate-fade-in { animation: fadeIn 0.3s ease; }
    .select-none { user-select: none; }
    .active\:scale-95:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // 아이콘 컴포넌트
    const DeleteIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/>
      </svg>
    );
    const ArrowRightIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
      </svg>
    );
    const RotateCcwIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.56"/>
      </svg>
    );
    const TrophyIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="8 17 12 21 16 17"/><line x1="12" y1="13" x2="12" y2="21"/><path d="M17 6H3a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h3m11-8h1a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-3"/><path d="M12 13V3"/>
      </svg>
    );

    function App() {
      const [targetProduct, setTargetProduct] = useState(null);
      const [selectedNum1, setSelectedNum1] = useState(null);
      const [selectedNum2, setSelectedNum2] = useState(null);
      const [score, setScore] = useState(0);
      const [message, setMessage] = useState('');
      const [messageType, setMessageType] = useState('');
      const [isChecking, setIsChecking] = useState(false);
      const [correctA, setCorrectA] = useState(null);
      const [startTime, setStartTime] = useState(Date.now());
      const [timeTaken, setTimeTaken] = useState(null);
      const [showTimeModal, setShowTimeModal] = useState(false);
      const [isHintMode, setIsHintMode] = useState(false);
      const [gameState, setGameState] = useState('select_time');
      const [timeLimit, setTimeLimit] = useState(null);
      const [timeLeft, setTimeLeft] = useState(null);

      const generateQuestion = useCallback((prevProduct = null, currentLimit = timeLimit) => {
        let a, b, newProduct;
        do {
          a = Math.floor(Math.random() * 8) + 2;
          b = Math.floor(Math.random() * 8) + 2;
          newProduct = a * b;
        } while (newProduct === prevProduct);

        setCorrectA(a);
        setTargetProduct(newProduct);
        setSelectedNum1(null);
        setSelectedNum2(null);
        setMessage('');
        setMessageType('');
        setIsChecking(false);
        setIsHintMode(false);
        setStartTime(Date.now());
        setShowTimeModal(false);
        if (currentLimit) setTimeLeft(currentLimit);
      }, [timeLimit]);

      const startGame = (limit) => {
        setTimeLimit(limit);
        setTimeLeft(limit);
        setGameState('playing');
        setScore(0);
        generateQuestion(null, limit);
      };

      useEffect(() => {
        if (gameState !== 'playing' || showTimeModal || isChecking || isHintMode) return;
        if (timeLeft > 0) {
          const timerId = setTimeout(() => setTimeLeft((prev) => prev - 1), 1000);
          return () => clearTimeout(timerId);
        } else if (timeLeft === 0 && !isHintMode) {
          setIsChecking(true);
          setMessage('시간 초과! ⏰');
          setMessageType('error');
          setTimeout(() => {
            setSelectedNum1(correctA);
            setSelectedNum2(null);
            setMessage('시간이 초과되어 첫 번째 숫자를 알려줄게요!');
            setMessageType('hint');
            setIsHintMode(true);
            setIsChecking(false);
          }, 1500);
        }
      }, [gameState, timeLeft, showTimeModal, isChecking, isHintMode, correctA]);

      useEffect(() => {
        generateQuestion();
      }, []);

      useEffect(() => {
        if (selectedNum1 !== null && selectedNum2 !== null) {
          setIsChecking(true);
          if (selectedNum1 * selectedNum2 === targetProduct) {
            const end = Date.now();
            setTimeTaken(((end - startTime) / 1000).toFixed(1));
            setMessage('정답입니다! 최고예요 🎉');
            setMessageType('success');
            setScore((s) => s + 10);
            setShowTimeModal(true);
          } else {
            setMessage('아쉽네요, 다시 생각해봐요! 🤔');
            setMessageType('error');
            setTimeout(() => {
              setSelectedNum1(correctA);
              setSelectedNum2(null);
              setMessage('첫 번째 숫자를 빨간색으로 알려줄게요!');
              setMessageType('hint');
              setIsHintMode(true);
              setIsChecking(false);
            }, 1200);
          }
        }
      }, [selectedNum1, selectedNum2, targetProduct, correctA, startTime]);

      const handleNumberClick = (num) => {
        if (isChecking) return;
        if (selectedNum1 === null) setSelectedNum1(num);
        else if (selectedNum2 === null) setSelectedNum2(num);
      };

      const handleClear = () => {
        if (isChecking) return;
        if (selectedNum1 !== null && selectedNum2 === null && !isHintMode) setSelectedNum1(null);
      };

      const getBoxClass = (num, isFirstBox = false) => {
        const base = "flex items-center justify-center rounded-2xl border-4 text-5xl font-black transition-all duration-300";
        const size = "w-20 h-20";
        if (num === null) return `${base} ${size} border-dashed border-sky-200 text-sky-200 bg-white`;
        if (messageType === 'success') return `${base} ${size} border-green-400 bg-green-50 text-green-500`;
        if (messageType === 'error') return `${base} ${size} border-red-400 bg-red-50 text-red-500 animate-pulse`;
        if (isHintMode && isFirstBox) return `${base} ${size} border-red-400 bg-red-50 text-red-500`;
        return `${base} ${size} border-sky-400 bg-sky-50 text-sky-500`;
      };

      if (gameState === 'select_time') {
        return (
          <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4 select-none">
            <div className="bg-white rounded-3xl shadow-xl p-8 w-full max-w-md border border-slate-100 text-center">
              <h1 className="text-3xl font-black text-slate-800 mb-4">구구단 거꾸로 풀기</h1>
              <p className="text-lg text-slate-500 mb-8">제한 시간을 선택하고 게임을 시작하세요!</p>
              <div className="flex flex-col gap-4">
                <button
                  onClick={() => startGame(5)}
                  className="w-full bg-rose-100 text-rose-600 font-bold py-5 px-6 rounded-2xl text-xl border-2 border-rose-200 flex items-center justify-center gap-2"
                  style={{cursor:'pointer'}}
                >
                  <span>⏱️</span> 5초 모드
                </button>
                <button
                  onClick={() => startGame(10)}
                  className="w-full bg-sky-100 text-sky-600 font-bold py-5 px-6 rounded-2xl text-xl border-2 border-sky-200 flex items-center justify-center gap-2"
                  style={{cursor:'pointer'}}
                >
                  <span>⏱️</span> 10초 모드
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4 select-none">
          <div className="bg-white rounded-3xl shadow-xl p-8 w-full max-w-md border border-slate-100 relative overflow-hidden">

            {showTimeModal && (
              <div className="absolute inset-0 bg-white flex flex-col items-center justify-center z-50 p-6 animate-fade-in">
                <div className="text-6xl mb-4">⏱️</div>
                <h2 className="text-3xl font-black text-slate-800 mb-2">정답!</h2>
                <p className="text-xl text-slate-600 mb-8 text-center">
                  <strong className="text-sky-600 text-3xl mx-2">{timeTaken}</strong>초 만에 풀었어요!
                </p>
                <button
                  onClick={() => generateQuestion(targetProduct)}
                  className="w-48 bg-sky-500 text-white font-bold py-4 px-6 rounded-2xl text-lg"
                  style={{cursor:'pointer'}}
                >
                  다음 문제
                </button>
              </div>
            )}

            <div className="flex justify-between items-center mb-6">
              <h1 className="text-2xl font-bold text-slate-800">구구단 거꾸로 풀기</h1>
              <div className="flex items-center gap-4">
                <div className="flex items-center gap-2 bg-amber-50 px-3 py-1 rounded-full text-amber-600 font-bold">
                  <TrophyIcon />
                  <span>{score}점</span>
                </div>
                <button onClick={() => setGameState('select_time')} className="text-slate-400 p-2 rounded-full" style={{cursor:'pointer'}}>
                  <RotateCcwIcon />
                </button>
              </div>
            </div>

            <div className="w-full bg-slate-100 h-4 rounded-full mb-6 overflow-hidden relative border border-slate-200">
              <div
                className={`h-full transition-all duration-1000 ${timeLeft <= 3 ? 'bg-red-400' : 'bg-sky-400'}`}
                style={{ width: `${(timeLeft / timeLimit) * 100}%` }}
              />
              <div className="absolute inset-0 flex items-center justify-center text-xs font-black text-gray-600">
                {timeLeft}초
              </div>
            </div>

            <div className="bg-sky-50 rounded-3xl p-8 mb-6 text-center border-2 border-sky-100">
              <div className="text-2xl font-bold text-slate-600 mb-1">
                <span className="text-5xl font-black text-sky-600 mr-1">{targetProduct}</span> 은(는)?
              </div>
              <div className="text-lg text-slate-500 mb-6">몇 곱하기 몇일까요?</div>
              <div className="flex items-center justify-center gap-4">
                <div className={getBoxClass(selectedNum1, true)}>
                  {selectedNum1 !== null ? selectedNum1 : '?'}
                </div>
                <div className="text-4xl font-black text-slate-300">×</div>
                <div className={getBoxClass(selectedNum2, false)}>
                  {selectedNum2 !== null ? selectedNum2 : '?'}
                </div>
              </div>
            </div>

            <div className={`h-8 text-center font-bold text-lg mb-4 transition-all duration-300 ${
              messageType === 'success' ? 'text-green-500 animate-bounce' :
              messageType === 'error' ? 'text-red-500' :
              messageType === 'hint' ? 'text-orange-500 animate-bounce' : 'text-transparent'
            }`}>
              {message || 'placeholder'}
            </div>

            <div className="grid grid-cols-3 gap-3 mb-4">
              {[1,2,3,4,5,6,7,8,9].map((num) => (
                <button
                  key={num}
                  onClick={() => handleNumberClick(num)}
                  disabled={isChecking}
                  className="bg-white border-2 border-slate-200 text-slate-700 text-3xl font-black py-5 rounded-2xl"
                  style={{cursor: isChecking ? 'not-allowed' : 'pointer', opacity: isChecking ? 0.5 : 1}}
                >
                  {num}
                </button>
              ))}
            </div>

            <div className="flex gap-3 mt-4">
              <button
                onClick={handleClear}
                disabled={isChecking || selectedNum1 === null}
                className="flex-1 flex items-center justify-center gap-2 py-3 rounded-2xl bg-slate-100 text-slate-600 font-bold"
                style={{cursor: (isChecking || selectedNum1 === null) ? 'not-allowed' : 'pointer', opacity: (isChecking || selectedNum1 === null) ? 0.5 : 1}}
              >
                <DeleteIcon /> 지우기
              </button>
              <button
                onClick={() => generateQuestion(targetProduct)}
                disabled={isChecking}
                className="flex-1 flex items-center justify-center gap-2 py-3 rounded-2xl bg-sky-100 text-sky-700 font-bold"
                style={{cursor: isChecking ? 'not-allowed' : 'pointer', opacity: isChecking ? 0.5 : 1}}
              >
                건너뛰기 <ArrowRightIcon />
              </button>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
